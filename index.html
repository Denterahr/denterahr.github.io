<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>بيانات دنتيرا</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141480'/%3E%3Cpath d='M9 8h7c5 0 8 3.200 8 8s-3 8-8 8H9z' fill='none' stroke='%230CB8CD' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"><style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><style id="site-style">/* Layout: fixed navy sidebar (route groups) + sticky topbar + scrolling view.
   Public routes open to everyone; HR routes and data manager appear for the admin only. */
:root{
  --bg:#EEF3F5;
  --surface:#FFFFFF;
  --surface-alt:#F4F8F9;
  --ink:#171A33;
  --ink-soft:#4E5568;
  --ink-faint:#68708A;
  --primary:#141480;
  --primary-2:#1E1EA0;
  --primary-soft:#E3E2F6;
  --brand-ink:#141480;
  --sidebar:#141480;
  --accent:#0CB8CD;
  --accent-ink:#0A6F7A;
  --accent-soft:#D7F2F6;
  --tooth:#B9AC97;
  --tooth-soft:#EFEBE3;
  --danger:#B23A34;
  --danger-soft:#F5DEDC;
  --warn:#9A6E12;
  --warn-soft:#F5E8C8;
  --ok:#2E8B6E;
  --ok-soft:#DCEEE7;
  --border:#DEE5E9;
  --grid:#E6ECEF;
  --radius:10px;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,20,128,.06),0 1px 8px rgba(20,20,128,.05);
  --scroll:#C7D3CE;
  --overlay:rgba(15,20,25,.55);
  --s1:#3B3BC4; --s2:#D08A12; --s3:#0A9FB3; --s4:#C2467A; --s5:#7A5CD6; --s6:#1F9A73;
  --s7:#5C8A9A; --s8:#8A6B3D; --s9:#7A9A3C; --s10:#AE3A34; --s11:#3D6FA8; --s12:#A85C6B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F21;
    --surface:#171A33;
    --surface-alt:#1D2140;
    --ink:#E9EBF7;
    --ink-soft:#B4BAD6;
    --ink-faint:#8D94B6;
    --primary:#2E2EB0;
    --primary-2:#3B3BC4;
    --primary-soft:#262A5C;
    --brand-ink:#B3B3F7;
    --sidebar:#10114A;
    --accent:#18A3B8;
    --accent-ink:#55D6E8;
    --accent-soft:#143A48;
    --tooth:#B9AC97;
    --tooth-soft:#2C2A2A;
    --danger:#EE7C76;
    --danger-soft:#3C2030;
    --warn:#E2B04A;
    --warn-soft:#3A3020;
    --ok:#4FC29D;
    --ok-soft:#173730;
    --border:#2A2F55;
    --grid:#262B4D;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --scroll:#3A4070;
    --overlay:rgba(0,0,0,.65);
    --s1:#7070E6; --s2:#C28516; --s3:#18A3B8; --s4:#D45588; --s5:#9680E4; --s6:#2AA77C;
    --s7:#6FA3B5; --s8:#B08A52; --s9:#98B85A; --s10:#E0706A; --s11:#6E9AD0; --s12:#CC7E8E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F21;
  --surface:#171A33;
  --surface-alt:#1D2140;
  --ink:#E9EBF7;
  --ink-soft:#B4BAD6;
  --ink-faint:#8D94B6;
  --primary:#2E2EB0;
  --primary-2:#3B3BC4;
  --primary-soft:#262A5C;
  --brand-ink:#B3B3F7;
  --sidebar:#10114A;
  --accent:#18A3B8;
  --accent-ink:#55D6E8;
  --accent-soft:#143A48;
  --tooth:#B9AC97;
  --tooth-soft:#2C2A2A;
  --danger:#EE7C76;
  --danger-soft:#3C2030;
  --warn:#E2B04A;
  --warn-soft:#3A3020;
  --ok:#4FC29D;
  --ok-soft:#173730;
  --border:#2A2F55;
  --grid:#262B4D;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --scroll:#3A4070;
  --overlay:rgba(0,0,0,.65);
  --s1:#7070E6; --s2:#C28516; --s3:#18A3B8; --s4:#D45588; --s5:#9680E4; --s6:#2AA77C;
  --s7:#6FA3B5; --s8:#B08A52; --s9:#98B85A; --s10:#E0706A; --s11:#6E9AD0; --s12:#CC7E8E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);
  font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sidebar)}
.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  width:248px;flex:none;background:var(--sidebar);color:#EAF2EF;
  display:flex;flex-direction:column;padding:20px 14px;gap:2px;
  position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;
}
.brand{padding:2px 2px 14px;margin-bottom:6px}
.brand-card{background:#fff;border-radius:9px;padding:12px 10px;display:flex;align-items:center;justify-content:center}
.brand-card img{width:100%;height:auto;display:block}
.brand-sub{font-size:11px;color:#A7B0E0;margin-top:9px;text-align:center;letter-spacing:.2px}
.nav-group{font-size:10.5px;font-weight:700;letter-spacing:.6px;color:#8D95CC;padding:14px 12px 5px;display:flex;align-items:center;gap:6px}
.nav-group svg{width:12px;height:12px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:#C7CBEE;cursor:pointer;font-size:13.4px;font-weight:500;border:1px solid transparent;
  transition:background .12s ease;background:none;width:100%;text-align:start;
}
.nav-item svg{flex:none;width:18px;height:18px;opacity:.85;color:#4FD6E8}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:#0CB8CD;color:#04333A;font-weight:700}
.nav-item.active svg{opacity:1;color:#04333A}
.nav-item.locked{opacity:.8}
.nav-count{
  margin-inline-start:auto;font-size:11px;background:rgba(255,255,255,.14);
  color:#EAF2EF;border-radius:20px;padding:1px 7px;font-weight:700;
}
.nav-item.active .nav-count{background:rgba(4,51,58,.18);color:#04333A}
.nav-item.has-alert .nav-count{background:#C9403A;color:#fff}
.sidebar-foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#9BA3D6;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:8px}
.foot-btn{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);color:#EAF2EF;font-size:12.3px;font-weight:600;cursor:pointer;width:100%;
}
.foot-btn:hover{background:rgba(255,255,255,.12)}
.foot-btn svg{width:15px;height:15px;flex:none}
.role-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(79,214,232,.16);color:#7FE3F0;align-self:flex-start}
.role-chip.guest{background:rgba(255,255,255,.1);color:#C7CBEE}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.topbar h1{font-size:19px;margin:0;font-weight:700;color:var(--brand-ink)}
.topbar .topbar-sub{font-size:12px;color:var(--ink-faint);margin-top:2px}
.topbar-title{min-width:0;flex:1 1 220px}
.search-wrap{position:relative;width:290px;max-width:100%}
.search-wrap input{
  width:100%;padding:9px 12px 9px 36px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);font-size:13px;color:var(--ink);
}
.search-wrap svg{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-faint);pointer-events:none}
.search-wrap input{padding-inline-end:34px;padding-inline-start:12px}
.pill{
  display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;
  font-weight:700;font-size:12.5px;white-space:nowrap;cursor:pointer;border:1px solid transparent;
}
.pill svg{width:15px;height:15px}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.danger:hover{border-color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.warn:hover{border-color:var(--warn)}
.theme-btn,.menu-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft)}
.menu-btn{display:none}

.view{padding:22px max(26px,env(safe-area-inset-left,0px)) 40px max(26px,env(safe-area-inset-right,0px));max-width:1360px;width:100%}
.footer-credit{padding:6px max(26px,env(safe-area-inset-right,0px)) 40px;color:var(--ink-faint);font-size:11px}
.view-head{margin-bottom:18px}
.view-head h2{font-size:20px;margin:0 0 4px;color:var(--brand-ink)}
.view-head p{margin:0;color:var(--ink-soft);font-size:13px}
.sec-title{font-size:13px;font-weight:700;color:var(--brand-ink);margin:18px 0 8px}

/* ---------- KPI cards ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;margin-bottom:20px}
.kpi-row.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.kpi-row.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--primary);
  border-radius:8px;padding:13px 15px;box-shadow:var(--shadow);min-width:0;
}
.kpi.c-accent{border-inline-start-color:var(--accent)}
.kpi.c-danger{border-inline-start-color:var(--danger)}
.kpi.c-warn{border-inline-start-color:var(--warn)}
.kpi.c-ok{border-inline-start-color:var(--ok)}
.kpi-label{font-size:12px;color:var(--ink-soft);margin-bottom:5px}
.kpi-value{font-size:24px;font-weight:700;color:var(--ink);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;text-align:end}
.kpi-value small{font-size:13px;font-weight:600;color:var(--ink-faint);margin-inline-start:3px}
.kpi-note{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.delta{font-size:11.5px;font-weight:700;direction:ltr;unicode-bidi:isolate;display:inline-block}
.delta.up{color:var(--ok)} .delta.down{color:var(--danger)} .delta.flat{color:var(--ink-faint)}

/* ---------- Grid / panels ---------- */
.grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-bottom:16px}
.grid-2e{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.grid-2>*,.grid-2e>*,.grid-3>*{min-width:0}
@media (max-width:980px){.grid-2,.grid-2e,.grid-3{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.grid-2 .panel,.grid-2e .panel,.grid-3 .panel{margin-bottom:0}
.panel h3{margin:0 0 3px;font-size:14.5px;color:var(--brand-ink)}
.panel .panel-sub{font-size:11.5px;color:var(--ink-faint);margin-bottom:12px}
.panel-scroll{max-height:360px;overflow-y:auto}
.chart-box{position:relative;height:250px;direction:ltr}
.chart-box.tall{height:300px}
.chart-box.short{height:210px}

/* ---------- Bars (custom, no chart lib) ---------- */
.barlist{display:flex;flex-direction:column;gap:9px}
.barlist .row{display:grid;grid-template-columns:minmax(80px,150px) 1fr 52px;align-items:center;gap:10px;font-size:12.5px}
.barlist .lbl{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barlist .track{background:var(--surface-alt);border-radius:5px;height:10px;overflow:hidden;display:flex}
.barlist .fill{height:100%;border-radius:5px;background:var(--primary)}
.barlist .val{direction:ltr;text-align:left;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.8px}
thead th{
  text-align:start;padding:9px 10px;background:var(--surface-alt);color:var(--ink-soft);
  font-weight:700;font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1;
}
tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:var(--surface-alt)}
td.num,th.num{direction:ltr;text-align:end;font-variant-numeric:tabular-nums}
.name-cell{font-weight:600;white-space:normal!important;min-width:150px}
.sub{display:block;font-size:11px;color:var(--ink-faint);font-weight:400}
tr.sel td{background:var(--primary-soft);font-weight:700}
tr.clickable{cursor:pointer}
tr.future td{color:var(--ink-faint)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.muted{background:var(--surface-alt);color:var(--ink-faint)}
.badge.accent{background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- Tabs / chips ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtab{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.subtab:hover{border-color:var(--primary-2)}
.subtab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.subtab.off{opacity:.45;cursor:default}
.subtab.cur{border-style:dashed}
.month-strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-bottom:18px}
.month-strip .subtab{padding:8px 4px;text-align:center;border-radius:8px;font-size:12px}
@media (max-width:760px){.month-strip{grid-template-columns:repeat(6,minmax(0,1fr))}}

.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.cat-tab{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.cat-tab .n{background:var(--surface-alt);border-radius:20px;padding:1px 8px;font-size:11.5px;color:var(--ink-faint)}
.cat-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.cat-tab.active .n{background:rgba(255,255,255,.18);color:#fff}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow);cursor:pointer;border-inline-start:4px solid var(--primary)}
.summary-card h4{margin:0 0 8px;font-size:14px;color:var(--brand-ink)}
.summary-card .big{font-size:26px;font-weight:700;direction:ltr;unicode-bidi:isolate;text-align:end}
.summary-card .row2{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.summary-card .row2 b{color:var(--ok)}
.summary-card .row2 b.bad{color:var(--danger)}
.unlinked-note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:11px 14px;font-size:12.5px;margin-top:18px;line-height:1.7}

/* ---------- Directory ---------- */
.dir-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.dir-toolbar input[type=text]{flex:1;min-width:220px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);font-size:13.5px;background:var(--surface)}
.dir-toolbar select,select.sel{padding:9px 10px;border-radius:8px;border:1px solid var(--border);font-size:12.5px;background:var(--surface)}
.dir-count{font-size:12px;color:var(--ink-faint);margin-bottom:10px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}

/* ---------- misc ---------- */
.legend-row{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--ink-soft);margin-top:10px}
.legend-row span{display:inline-flex;align-items:center;gap:5px}
.legend-row i{width:9px;height:9px;border-radius:2px;display:inline-block}
.note-box{background:var(--surface-alt);border:1px dashed var(--border);border-radius:8px;padding:10px 13px;font-size:12px;color:var(--ink-soft);margin-bottom:16px;line-height:1.8}
.empty-state{padding:30px;text-align:center;color:var(--ink-faint);font-size:13px}
.attach-links{display:flex;gap:6px;flex-wrap:wrap}
.attach-link{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;text-decoration:none;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.attach-link:hover{background:var(--accent);color:#04333A}
.attach-link.disabled{background:var(--surface-alt);color:var(--ink-faint);pointer-events:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- locked / gate ---------- */
.gate{max-width:520px;margin:40px auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:34px 28px;box-shadow:var(--shadow)}
.gate svg{width:38px;height:38px;color:var(--brand-ink);margin-bottom:10px}
.gate h2{margin:0 0 8px;font-size:18px;color:var(--brand-ink)}
.gate p{margin:0 0 6px;color:var(--ink-soft);font-size:13.5px;line-height:1.9}

/* ---------- buttons / forms ---------- */
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--brand-ink);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--primary-2)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.file-drop{border:2px dashed var(--border);border-radius:10px;padding:26px 16px;text-align:center;cursor:pointer;color:var(--ink-soft);font-size:13px;background:var(--surface-alt);display:block}
.file-drop:hover,.file-drop.over{border-color:var(--accent);color:var(--brand-ink)}
.file-drop input{display:none}
.status{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.8}
.status.info{background:var(--primary-soft);color:var(--brand-ink)}
.status.success{background:var(--ok-soft);color:var(--ok)}
.status.error{background:var(--danger-soft);color:var(--danger)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-soft)}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--brand-ink);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.ds-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}

    var strip = HR_STRIP[k];
    out[k] = !strip ? rows.map(function(r){ return Object.assign({}, r); }) : rows.map(function(r){
      var o = Object.assign({}, r);
      strip.forEach(function(f){ if(f in o) o[f] = null; });
      return o;
    });
  });
  return out;
}

/* Admin only: payroll-side monthly figures. Uses the salaries on file today, so it is an estimate for past months. */
function buildFinance(d, todayISO){
  var cur = todayISO.slice(0, 7);
  var rng = monthRange(d, cur);
  var P = timeline(d, cur);
  var S = d.salary_increases || [];
  return ymRange(rng.from, ymAdd(cur, 12)).map(function(ym){
    var row = { ym: ym, future: ym > cur };
    if(ym <= cur){
      var here = P.filter(function(p){ return p.s <= ym && (p.x === null || p.x > ym); });
      row.payroll = sum(here, function(p){ return p.pay; });
      row.hire_pay = sum(P.filter(function(p){ return p.s === ym && p.startKnown !== false; }), function(p){ return p.pay; });
      row.eos = sum(P.filter(function(p){ return p.x === ym; }), function(p){ return p.eos; });
      row.exit_pay = sum(P.filter(function(p){ return p.x === ym; }), function(p){ return p.pay; });
    }
    var due = S.filter(function(s){ return ymOf(s.end_contract) === ym; });
    row.incr_amount = Math.round(sum(due, function(s){ return s.increase_amount; }));
    row.incr_count = due.length;
    return row;
  });
}

/* ---- helpers (from the HR dashboard) ---- */
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $all(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function esc(v){
  if(v===null || v===undefined) return '';
  return String(v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function ltr(v){ return '<span class="num">'+esc(v)+'</span>'; }

function fmtNum(n, digits){
  if(n===null || n===undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', {maximumFractionDigits: digits===undefined?0:digits});
}
function fmtSAR(n){
  if(n===null || n===undefined || isNaN(n)) return '—';
  return '<span class="num">'+fmtNum(n)+'</span> ر.س';
}
function fmtPct(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return '<span class="num">'+fmtNum(n,1)+'%</span>';
}

var AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function parseISO(iso){
  if(!iso) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m) return null;
  var d = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  if(isNaN(d.getTime())) return null;
  return d;
}
function fmtDate(iso){
  var d = parseISO(iso);
  if(!d) return '—';
  return '<span class="num">'+d.getDate()+' '+AR_MONTHS[d.getMonth()]+' '+d.getFullYear()+'</span>';
}
function today0(){
  var t = new Date();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate());
}
var TODAY = today0();
function daysUntil(iso){
  var d = parseISO(iso);
  if(!d) return null;
  return Math.round((d - TODAY) / 86400000);
}

/* status classification for a "days remaining" figure */
function expiryStatus(days){
  if(days===null) return {text:'غير محدد', cls:'muted', order:9};
  if(days < 0) return {text:'منتهي منذ '+fmtNum(Math.abs(days))+' يوم', cls:'danger', order:0};
  if(days < 60) return {text:'خلال '+fmtNum(days)+' يوم — عاجل', cls:'danger', order:1};
  if(days < 90) return {text:'خلال '+fmtNum(days)+' يوم', cls:'warn', order:2};
  return {text:'ساري ('+fmtNum(days)+' يوم)', cls:'ok', order:3};
}
function daysBadge(iso){
  var d = daysUntil(iso);
  var s = expiryStatus(d);
  return '<span class="badge '+s.cls+'"><i class="dot"></i>'+s.text+'</span>';
}
function attachLink(url, label){
  if(!url) return '<span class="attach-link disabled">'+label+'</span>';
  return '<a class="attach-link" href="'+esc(url)+'" target="_blank" rel="noopener">'+label+' ↗</a>';
}
function attachmentLinksHTML(classification, license, insurance){
  return '<div class="attach-links">'+
    attachLink(classification, 'تصنيف')+
    attachLink(license, 'ترخيص')+
    attachLink(insurance, 'تأمين')+
  '</div>';
}

function groupCount(arr, fn){
  var o = {};
  arr.forEach(function(x){
    var k = fn(x);
    if(k===null || k===undefined || k==='') k = 'غير محدد';
    o[k] = (o[k]||0) + 1;
  });
  return o;
}
function groupSum(arr, keyFn, valFn){
  var o = {};
  arr.forEach(function(x){
    var k = keyFn(x);
    if(k===null || k===undefined || k==='') k = 'غير محدد';
    o[k] = (o[k]||0) + (valFn(x)||0);
  });
  return o;
}
function sumBy(arr, fn){ return arr.reduce(function(a,x){ return a + (fn(x)||0); }, 0); }
function sortedEntries(obj){
  return Object.keys(obj).map(function(k){ return [k, obj[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
}
function topN(entries, n){ return entries.slice(0, n); }

var PALETTE = [];

function barListHTML(entries, opts){
  opts = opts||{};
  var max = Math.max.apply(null, entries.map(function(e){return e[1];})) || 1;
  var total = opts.total || sumBy(entries, function(e){return e[1];});
  return '<div class="barlist">' + entries.map(function(e, i){
    var pct = Math.round((e[1]/max)*100);
    var color = opts.color || PALETTE[i % PALETTE.length];
    var shareTxt = opts.showShare ? ' <span style="color:var(--ink-faint)">('+fmtNum(total? e[1]/total*100:0,1)+'%)</span>' : '';
    return '<div class="row">'+
      '<div class="lbl" title="'+esc(e[0])+'">'+esc(e[0])+'</div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
      '<div class="val">'+fmtNum(e[1])+shareTxt+'</div>'+
    '</div>';
  }).join('') + '</div>';
}

/* ---------------- charts ---------------- */
var CH = {};
function destroyCharts(){ Object.keys(CH).forEach(function(k){ try{ CH[k].destroy(); }catch(e){} delete CH[k]; }); }
function themeChart(){
  if(!window.Chart) return;
  Chart.defaults.font.family = "'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif";
  Chart.defaults.font.size = 11;
  Chart.defaults.color = cssv('--ink-soft');
  Chart.defaults.borderColor = cssv('--grid');
}
function withAlpha(hex, a){
  if(!/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  return hex + a;
}
function chartBox(id, cls){ return '<div class="chart-box ' + (cls || '') + '"><canvas id="' + id + '" role="img"></canvas></div>'; }

function baseOpts(nSeries, o){
  o = o || {};
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: nSeries > 1, position: 'top', align: 'end', rtl: true,
        labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8, padding: 14, color: cssv('--ink-soft') } },
      tooltip: { rtl: true, textDirection: 'rtl', backgroundColor: cssv('--ink'), titleColor: cssv('--bg'), bodyColor: cssv('--bg'),
        padding: 10, cornerRadius: 8, boxPadding: 4, usePointStyle: true,
        callbacks: o.tipCb || {} }
    },
    scales: {
      x: { stacked: !!o.stacked, grid: { display: false }, border: { color: cssv('--border') }, ticks: { maxRotation: 0, autoSkip: true, color: cssv('--ink-soft') } },
      y: { stacked: !!o.stacked, beginAtZero: o.zero !== false, grid: { color: cssv('--grid') }, border: { display: false },
        ticks: { precision: 0, color: cssv('--ink-soft'), callback: o.yTick }, suggestedMax: o.yMax, min: o.yMin }
    }
  };
}
function mkChart(id, cfg){
  var el = document.getElementById(id);
  if(!el) return;
  if(!window.Chart){
    el.parentNode.innerHTML = '<div class="empty-state">تعذّر تحميل مكتبة الرسوم. الجداول أسفل الصفحة تحمل نفس الأرقام.</div>';
    return;
  }
  themeChart();
  if(CH[id]) CH[id].destroy();
  CH[id] = new Chart(el, cfg);
}

/* line chart: sets = [{label, data, color:'--s1'}]; sel = index to emphasise */
function lineChart(id, labels, sets, o){
  o = o || {};
  var ds = sets.map(function(s){
    var c = cssv(s.color);
    return { label: s.label, data: s.data, borderColor: c, backgroundColor: withAlpha(c, '22'), fill: !!s.fill, tension: .25,
      borderWidth: 2, pointRadius: labels.map(function(_, i){ return i === o.sel ? 6 : 2.5; }),
      pointHoverRadius: 7, pointBackgroundColor: labels.map(function(_, i){ return i === o.sel ? cssv('--surface') : c; }),
      pointBorderColor: c, pointBorderWidth: labels.map(function(_, i){ return i === o.sel ? 3 : 1; }) };
  });
  mkChart(id, { type: 'line', data: { labels: o.fullLabels || labels, datasets: ds }, options: (function(){
    var op = baseOpts(sets.length, o);
    op.scales.x.ticks.callback = function(v){ return labels[v]; };
    return op;
  })() });
}
/* bar chart: sets = [{label, data, color}]; sel dims the other bars */
function barChart(id, labels, sets, o){
  o = o || {};
  var ds = sets.map(function(s){
    var c = cssv(s.color);
    var bg = labels.map(function(_, i){ return (o.sel === undefined || o.sel === null || i === o.sel) ? c : withAlpha(c, '8C'); });
    return { label: s.label, data: s.data, backgroundColor: bg, borderRadius: o.stacked ? 0 : 3,
      borderSkipped: false, borderWidth: o.stacked ? 2 : 0, borderColor: cssv('--surface'),
      maxBarThickness: 26 };
  });
  mkChart(id, { type: 'bar', data: { labels: o.fullLabels || labels, datasets: ds }, options: (function(){
    var op = baseOpts(sets.length, o);
    op.scales.x.ticks.callback = function(v){ return labels[v]; };
    return op;
  })() });
}

function deltaHTML(n, suffix, goodWhenUp){
  if(n === null || n === undefined || isNaN(n)) return '';
  var r = Math.round(n * 10) / 10;
  if(r === 0) return '<span class="delta flat">0' + (suffix || '') + '</span>';
  var up = r > 0, good = (goodWhenUp === false) ? !up : up;
  return '<span class="delta ' + (good ? 'up' : 'down') + '">' + (up ? '+' : '−') + fmtNum(Math.abs(r), 1) + (suffix || '') + '</span>';
}
function kpi(label, value, note, cls, small){
  return '<div class="kpi ' + (cls || '') + '"><div class="kpi-label">' + esc(label) + '</div><div class="kpi-value">' + value +
    (small ? '<small>' + small + '</small>' : '') + '</div>' + (note ? '<div class="kpi-note">' + note + '</div>' : '') + '</div>';
}

/* contract-type label for any record coming from EMP / OC / TRAINEES */
function contractTypeLabel(rec, src){
  if(src==='emp') return 'عقد أساسي';
  if(src==='trainee') return 'تمهير';
  if(src==='oc'){
    if(rec.department==='أطباء') return 'دوام جزئي (نسبة أطباء)';
    return rec.contract_type || 'عقد آخر';
  }
  return 'غير محدد';
}

function increaseStatus(note){
  var t = (note||'').trim();
  if(!t) return {text:'غير محدد', cls:'muted'};
  if(/الغ/.test(t)) return {text:'أُلغيت', cls:'danger'};
  if(/قيد التنفيذ/.test(t)) return {text:'قيد التنفيذ', cls:'warn'};
  if(/نفذ|تنفيذ/.test(t)) return {text:'نُفذت', cls:'ok'};
  return {text: t, cls:'muted'};
}

/* consolidated alert feed used by the top bar + overview panel */
function computeAlerts(){
  var items = [];
  DOCS.forEach(function(d){
    var days = daysUntil(d.license_expiry);
    if(days!==null && days<60) items.push({cat:'ترخيص طبيب', name:d.name, detail:(d.specialty||''), days:days, tab:'licenses', sub:'doctors'});
    var idays = daysUntil(d.insurance_expiry);
    if(idays!==null && idays<60) items.push({cat:'تأمين أخطاء طبية', name:d.name, detail:(d.specialty||''), days:idays, tab:'licenses', sub:'doctors'});
  });
  MED.forEach(function(d){
    var days = daysUntil(d.license_expiry);
    if(days!==null && days<60) items.push({cat:'ترخيص ممارسة', name:d.name, detail:(d.category||''), days:days, tab:'licenses', sub:'nursing'});
    var cdays = daysUntil(d.classification_expiry);
    if(cdays!==null && cdays<60) items.push({cat:'تصنيف مهني', name:d.name, detail:(d.category||''), days:cdays, tab:'licenses', sub:'nursing'});
    if(d.license_status==='INVALID') items.push({cat:'ترخيص غير ساري', name:d.name, detail:(d.category||''), days:-999, tab:'licenses', sub:'nursing'});
  });
  EMP.forEach(function(e){
    var days = daysUntil(e.end);
    if(days!==null && days<60) items.push({cat:'نهاية عقد', name:e.name, detail:(e.job_title||''), days:days, tab:'contracts', sub:'ending'});
  });
  OC.forEach(function(e){
    var days = daysUntil(e.end);
    if(days!==null && days<60) items.push({cat:'نهاية عقد (أخرى)', name:e.name, detail:(e.job_title||''), days:days, tab:'contracts', sub:'ending'});
  });
  TRAINEES.forEach(function(e){
    var days = daysUntil(e.end);
    if(days!==null && days<60) items.push({cat:'نهاية فترة تمهير', name:e.name, detail:'متدرب', days:days, tab:'contracts', sub:'trainees'});
  });
  items.sort(function(a,b){ return a.days-b.days; });
  return items;
}

/* (re)compute every derived dataset from a freshly parsed workbook object */
function deriveFromData(d){
  CURRENT_DATA = d;
  EMP = d.employees; OC = d.other_contracts;
  OC_REAL = OC.filter(function(o){ return o.department !== 'أطباء'; });
  OC_DOC  = OC.filter(function(o){ return o.department === 'أطباء'; });
  PCT = d.doctors_percentage; DOCS = d.doctors_docs; MED = d.medical_docs;
  ENDC = d.end_contracts; INCR = d.salary_increases; TRAIN = d.training_courses;
  TRAINEES = d.trainees; DOCM = d.doctors_master; NOTES = d.contract_end_notes;

  TOTAL_HEADCOUNT = EMP.length + OC.length;
  TOTAL_PAYROLL_FIXED = sumBy(EMP, function(e){return e.total;});
  OC_CASH = OC_REAL.filter(function(o){ return (o.pay_status||'').toLowerCase()==='cash'; });
  OC_INVOICE = OC_REAL.filter(function(o){ return o.pay_status==='Monthly Invoices'; });
  TOTAL_CASH_SALARY = sumBy(OC_CASH, function(o){return o.salary;});
  TOTAL_INVOICE_SALARY = sumBy(OC_INVOICE, function(o){return o.salary;});
  TOTAL_OTHER_SALARY = sumBy(OC_REAL, function(o){return o.salary;});

  SUM_BASIC = sumBy(EMP, function(e){return e.basic;});
  SUM_HOUSING = sumBy(EMP, function(e){return e.housing;});
  SUM_TRANSPORT = sumBy(EMP, function(e){return e.transport;});
  SUM_FOOD = sumBy(EMP, function(e){return e.food;});
  SUM_ADDITIONAL = sumBy(EMP, function(e){return e.additional;});
  SUM_GOSI = sumBy(EMP, function(e){return e.gosi;});
  SALARY_COMPONENTS = [
    ['الراتب الأساسي', SUM_BASIC], ['بدل السكن', SUM_HOUSING], ['بدل النقل', SUM_TRANSPORT],
    ['بدل الطعام', SUM_FOOD], ['بدلات إضافية', SUM_ADDITIONAL], ['التأمينات الاجتماعية GOSI', SUM_GOSI]
  ];

  WF_ALL = [].concat(
    EMP.map(function(e){ return {name:e.name, job_title:e.job_title, department:e.department, nationality:e.nationality, gender:e.gender, branch:e.branch, type:contractTypeLabel(e,'emp')}; }),
    OC.map(function(o){ return {name:o.name, job_title:o.job_title, department:o.department, nationality:o.nationality, gender:o.gender, branch:o.branch, type:contractTypeLabel(o,'oc')}; })
  );

  DIR_ALL = [].concat(
    EMP.map(function(e){ return {
      name:e.name, national_id:e.national_id, employee_id:e.employee_id, job_title:e.job_title,
      department:e.department, branch:e.branch, nationality:e.nationality, gender:e.gender,
      mobile:e.mobile, email:e.email, end:e.end, type:'عقد أساسي',
      salary_html: fmtSAR(e.total), bank:e.bank
    };}),
    OC.map(function(o){ return {
      name:o.name, national_id:o.national_id, employee_id:o.employee_id, job_title:o.job_title,
      department:o.department, branch:o.branch, nationality:o.nationality, gender:o.gender,
      mobile:o.mobile, email:o.email, end:o.end, type:contractTypeLabel(o,'oc'),
      salary_html: o.department==='أطباء' ? (o.salary? fmtNum(o.salary)+'%' : '—') :
        fmtSAR(o.salary)+' <span class="sub">'+(o.pay_status==='cash'?'نقدًا':'فواتير شهرية')+'</span>',
      bank:o.pay_status
    };})
  ).sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'ar'); });

  ALERTS = computeAlerts();
}

function sortByDays(arr, dateField){
  return arr.slice().sort(function(a,b){
    var da = daysUntil(a[dateField]); var db = daysUntil(b[dateField]);
    if(da===null && db===null) return 0;
    if(da===null) return 1;
    if(db===null) return -1;
    return da-db;
  });
}
/* a license on file is only "currently licensed" if it exists AND its expiry date hasn't passed */
function isDoctorLicensedNow(d){
  if(!d.license_no || d.license_no==='N/A') return false;
  var days = daysUntil(d.license_expiry);
  if(days!==null && days<0) return false;
  return true;
}
function isNursingLicensedNow(d){
  if(d.license_status!=='VALID') return false;
  var days = daysUntil(d.license_expiry);
  if(days!==null && days<0) return false;
  return true;
}

function normSpecialty(str){
  if(!str) return 'غير محدد';
  var t = String(str).replace(/[\u2013\u2014]/g,'-').trim(); // unify en/em dash to a plain hyphen
  t = t.replace(/\s*-\s*/g, '-').replace(/\s+/g,' ');         // no stray spaces around the hyphen
  return t.charAt(0).toUpperCase() + t.slice(1);              // fix stray lowercase first letter only
}

function dirFiltered(){

function summaryLine(m, prev){
  var s = 'في ' + SR.ymLabel(m.ym) + ' ';
  var parts = [];
  parts.push(m.hires ? 'انضم ' + fmtNum(m.hires) + (m.hires === 1 ? ' موظف' : ' موظفين') : 'لم يُسجَّل تعيين جديد');
  parts.push(m.exits ? 'وغادر ' + fmtNum(m.exits) : 'ولم تُسجَّل مغادرة');
  s += parts.join(' ') + '، فبلغ عدد الموظفين ' + fmtNum(m.headcount);
  if(prev) s += ' (' + (m.headcount - prev.headcount >= 0 ? '+' : '−') + fmtNum(Math.abs(m.headcount - prev.headcount)) + ' عن الشهر السابق)';
  s += ' ونسبة التوطين ' + fmtNum(m.saudi_pct, 1) + '%.';
  return s;
}

/* ---------------- Medical staff (licensed only / everyone) ---------------- */
var MED_CATS = ['أطباء','تمريض','صحة عامة','أشعة','تعقيم'];

function clinLicensedNow(c){
  if(c.category === 'أطباء'){
    if(!c.license_expiry) return false;
    var d = daysUntil(c.license_expiry);
    return d !== null && d >= 0;
  }
  if(!c.license_status || c.license_status !== 'VALID') return false;
  var d2 = daysUntil(c.license_expiry);
  if(d2 !== null && d2 < 0) return false;
  return true;
}
function clinBadge(c){
  if(c.category === 'أطباء'){
    if(!c.license_expiry) return '<span class="badge muted">لا يوجد ترخيص</span>';
    var d = daysUntil(c.license_expiry);
    if(d < 0) return '<span class="badge danger">منتهٍ — ' + fmtDate(c.license_expiry) + '</span>';
    return '<span class="badge ok">ساري حتى ' + fmtDate(c.license_expiry) + '</span>';
  }
  if(!c.license_status) return '<span class="badge muted">لا يوجد سجل ترخيص</span>';
  if(c.license_status !== 'VALID') return '<span class="badge danger">' + esc(c.license_status) + '</span>';
  var d2 = daysUntil(c.license_expiry);
  if(d2 !== null && d2 < 0) return '<span class="badge danger">منتهٍ — ' + fmtDate(c.license_expiry) + '</span>';
  return '<span class="badge ok">ساري' + (c.license_expiry ? (' حتى ' + fmtDate(c.license_expiry)) : '') + '</span>';
}
function clinLinks(c){ return attachmentLinksHTML(c.classification_attachment, c.license_attachment, c.insurance_attachment); }

function medModel(mode){
  var all = (PUB && PUB.clinical_staff) || [];
  var list = mode === 'lic' ? all.filter(clinLicensedNow) : all;
  var byCat = {};
  MED_CATS.forEach(function(cat){ byCat[cat] = list.filter(function(c){ return c.category === cat; }); });
  var unlinked = list.filter(function(c){ return !c.category; });
  return { mode: mode, list: list, byCat: byCat, unlinked: unlinked, total: list.length - unlinked.length };
}

/* next 12 months of license expiries for people who are licensed today, stacked by category */
function expiryChart(id, list, byCategory){
  var start = TODAY.getFullYear() + '-' + String(TODAY.getMonth() + 1).padStart(2, '0');
  var yms = SR.ymRange(start, SR.ymAdd(start, 11));
  var live = list.filter(clinLicensedNow);
  var labels = yms.map(ymShort), full = yms.map(SR.ymLabel);
  var sets;
  if(byCategory){
    sets = MED_CATS.map(function(c, ci){
      return { label: c, color: '--s' + (ci + 1), data: yms.map(function(ym){ return live.filter(function(x){ return x.category === c && SR.ymOf(x.license_expiry) === ym; }).length; }) };
    }).filter(function(s){ return s.data.some(function(v){ return v > 0; }); });
  } else {
    sets = [{ label: 'تراخيص تنتهي', color: '--s2', data: yms.map(function(ym){ return live.filter(function(x){ return SR.ymOf(x.license_expiry) === ym; }).length; }) }];
  }
  if(!sets.length) sets = [{ label: 'تراخيص تنتهي', color: '--s2', data: yms.map(function(){ return 0; }) }];
  barChart(id, labels, sets, { stacked: byCategory, fullLabels: full });
}

/* replace whole datasets (or one edited dataset) and refresh every tier */
async function writeDatasets(map, source){
  var D = Object.assign({}, DATA || {});
  Object.keys(map).forEach(function(k){ D[k] = map[k]; });
  DS_KEYS.forEach(function(k){ if(!Array.isArray(D[k])) D[k] = []; });
  var res = await saveAll(D, source);
  setData(D, { updated_at: res.updated_at, source: source, counts: res.counts });   // local copy is authoritative once the write has landed
}

/* ---------------- Data manager ---------------- */
var ED = null;        // editor state for one dataset
var UP = null;        // parsed upload waiting for confirmation
var MSG = null;       // {kind, text}

function loadXLSX(){
  return new Promise(function(res, rej){
    if(window.XLSX) return res();
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error('تعذّر تحميل مكتبة قراءة ملفات الإكسل. تحقق من الاتصال وأعد المحاولة.')); };
    document.head.appendChild(s);
  });
}
function fmtStamp(iso){
  if(!iso) return '—';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return '<span class="num">' + d.getDate() + ' ' + AR_MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '، ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + '</span>';
}
function setMsg(kind, text){ MSG = text ? { kind: kind, text: text } : null; var el = $('#dmMsg'); if(el) el.innerHTML = msgHTML(); }
function msgHTML(){ return MSG ? '<div class="status ' + MSG.kind + '">' + esc(MSG.text) + '</div>' : ''; }

function editorColumns(rows){
  var cols = [];
  rows.forEach(function(r){ Object.keys(r).forEach(function(k){ if(cols.indexOf(k) < 0) cols.push(k); }); });
  return cols;
}
function colType(rows, c){
  var seen = false, allNum = true;
  for(var i = 0; i < rows.length; i++){
    var v = rows[i][c];
    if(v === null || v === undefined) continue;
    if(typeof v === 'object') return 'json';
    seen = true;
    if(typeof v !== 'number') allNum = false;
  }
  return (seen && allNum) ? 'number' : 'text';
}
function cellVal(v, type){
  if(v === null || v === undefined) return '';
  if(type === 'json') return JSON.stringify(v);
  return String(v);
}
function parseCell(s, type){
  if(s === '') return null;
  if(type === 'number'){ var n = Number(s); return isNaN(n) ? s : n; }
  if(type === 'json'){ try{ return JSON.parse(s); }catch(e){ return s; } }
  return s;
}

function openEditor(key){
  var rows = (DATA && DATA[key]) || [];
  var cols = editorColumns(rows);
  var types = {}; cols.forEach(function(c){ types[c] = colType(rows, c); });
  ED = { key: key, cols: cols, types: types, rows: JSON.parse(JSON.stringify(rows)), st: rows.map(function(){ return 'orig'; }), q: '' };
}
function edChanges(){
  if(!ED) return 0;
  return ED.st.filter(function(s){ return s !== 'orig'; }).length;
}

function renderEditor(){
  var box = $('#edBox'); if(!box) return;
  if(!ED){ box.innerHTML = ''; return; }
  var q = (ED.q || '').toLowerCase();
  var rowsHtml = ED.rows.map(function(r, ri){
    var st = ED.st[ri];
    if(q){
      var hay = ED.cols.map(function(c){ return cellVal(r[c], ED.types[c]); }).join(' ').toLowerCase();
      if(hay.indexOf(q) < 0 && st === 'orig') return '';
    }
    return '<tr class="' + (st === 'orig' ? '' : st) + '" data-r="' + ri + '">' +
      '<td class="act"><button class="btn ghost sm" data-del="' + ri + '" title="حذف الصف">حذف</button></td>' +
      ED.cols.map(function(c){
        return '<td><input type="text" data-r="' + ri + '" data-c="' + esc(c) + '" value="' + esc(cellVal(r[c], ED.types[c])) + '"' + (ED.types[c] === 'number' ? ' inputmode="decimal" dir="ltr"' : '') + '></td>';
      }).join('') + '</tr>';
  }).join('');
  var n = edChanges();
  box.innerHTML =
    '<div class="panel"><h3>' + esc(DS_LABELS[ED.key] || ED.key) + '</h3><div class="panel-sub">' + fmtNum(ED.rows.length) + ' صفًا · عدّل أي خلية مباشرة. الصفوف الصفراء معدّلة والخضراء جديدة.</div>' +
    '<div class="dir-toolbar"><input type="text" id="edSearch" placeholder="ابحث داخل الجدول…" value="' + esc(ED.q) + '">' +
    '<button class="btn ghost sm" id="edAdd">إضافة صف</button></div>' +
    '<div class="table-wrap panel-scroll grid-edit" style="max-height:480px"><table><thead><tr><th></th>' + ED.cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (rowsHtml || '<tr><td colspan="' + (ED.cols.length + 1) + '" class="empty-state">لا توجد صفوف مطابقة</td></tr>') + '</tbody></table></div>' +
    '<div class="btn-row" style="margin-top:14px"><button class="btn" id="edSave"' + (n ? '' : ' disabled') + '>حفظ التعديلات (' + fmtNum(n) + ')</button>' +
    '<button class="btn ghost" id="edCancel">إلغاء</button><span class="xl-note">الحفظ يحدّث الموقع فورًا لكل من يفتحه، وكل شخص يرى حسب صلاحيته.</span></div></div>';

  var tb = box.querySelector('tbody');
  tb.addEventListener('input', function(ev){
    var t = ev.target;
    if(t.tagName !== 'INPUT') return;
    var ri = +t.getAttribute('data-r'), c = t.getAttribute('data-c');
    ED.rows[ri][c] = parseCell(t.value, ED.types[c]);
    if(ED.st[ri] === 'orig') { ED.st[ri] = 'changed'; t.closest('tr').className = 'changed'; }
    var b = $('#edSave'); if(b){ var k = edChanges(); b.disabled = !k; b.textContent = 'حفظ التعديلات (' + fmtNum(k) + ')'; }
  });
  tb.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-del]'); if(!b) return;
    var ri = +b.getAttribute('data-del');
    if(ED.st[ri] === 'added'){ ED.rows.splice(ri, 1); ED.st.splice(ri, 1); }
    else ED.st[ri] = 'removed';
    renderEditor();
  });
  $('#edSearch').addEventListener('input', function(){ ED.q = this.value; var pos = this.selectionStart; renderEditor(); var s = $('#edSearch'); s.focus(); try{ s.setSelectionRange(pos, pos); }catch(e){} });
  $('#edAdd').addEventListener('click', function(){
    var blank = {}; ED.cols.forEach(function(c){ blank[c] = null; });
    ED.rows.push(blank); ED.st.push('added'); renderEditor();
    var sc = box.querySelector('.panel-scroll'); if(sc) sc.scrollTop = sc.scrollHeight;
  });
  $('#edCancel').addEventListener('click', function(){ ED = null; renderEditor(); renderDsList(); });
  $('#edSave').addEventListener('click', saveEditor);
}

async function saveEditor(){
  if(!ED || !edChanges()) return;
  var rows = ED.rows.filter(function(r, i){ return ED.st[i] !== 'removed'; });
  rows = rows.filter(function(r){ return Object.keys(r).some(function(k){ return r[k] !== null && r[k] !== ''; }); });
  var btn = $('#edSave'); if(btn){ btn.disabled = true; btn.textContent = 'جاري الحفظ…'; }
  try{
    var map = {}; map[ED.key] = rows;
    await writeDatasets(map, 'تعديل يدوي — ' + (DS_LABELS[ED.key] || ED.key));
    toast('تم حفظ التعديلات');
    ED = null;
    RENDERERS.data();
  }catch(e){
    setMsg('error', 'تعذّر الحفظ: ' + (e && e.message ? e.message : e));
    if(btn){ btn.disabled = false; btn.textContent = 'حفظ التعديلات'; }
  }
}

function renderDsList(){
  var el = $('#dsList'); if(!el) return;
  el.innerHTML = DS_KEYS.map(function(k){
    var n = ((DATA && DATA[k]) || []).length;
    return '<button class="ds-card' + (ED && ED.key === k ? ' active' : '') + '" data-ds="' + k + '"><b>' + esc(DS_LABELS[k]) + '</b><span>' + fmtNum(n) + ' صفًا</span></button>';
  }).join('');
  $all('#dsList .ds-card').forEach(function(b){
    b.addEventListener('click', function(){
      if(ED && edChanges()){ setMsg('warn', 'لديك تعديلات غير محفوظة في «' + (DS_LABELS[ED.key] || ED.key) + '». احفظها أو اضغط إلغاء ثم اختر جدولًا آخر.'); return; }
      openEditor(b.getAttribute('data-ds')); renderEditor(); renderDsList(); setMsg(null);
    });
  });
}

function previewTable(newData){
  return '<div class="table-wrap"><table><thead><tr><th>الجدول</th><th class="num">الحالي</th><th class="num">في الملف الجديد</th><th class="num">الفرق</th></tr></thead><tbody>' +
    DS_KEYS.map(function(k){
      var a = ((DATA && DATA[k]) || []).length, b = (newData[k] || []).length, d = b - a;
      return '<tr><td>' + esc(DS_LABELS[k]) + '</td><td class="num">' + fmtNum(a) + '</td><td class="num">' + fmtNum(b) + '</td><td class="num">' + (d > 0 ? '+' : (d < 0 ? '−' : '')) + fmtNum(Math.abs(d)) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

async function handleFile(file){
  if(!file) return;
  UP = null; setMsg('info', 'جاري قراءة الملف…');
  try{
    await loadXLSX();
    var buf = await file.arrayBuffer();
    var wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
    var d = window.DenteraExtract.extractAll(wb);
    var total = DS_KEYS.reduce(function(a, k){ return a + (d[k] ? d[k].length : 0); }, 0);
    if(!total) throw new Error('لم يُعثر على بيانات. تأكد أن الملف هو ملف البيانات الرئيسي وبنفس أسماء الأوراق.');
    UP = { name: file.name, data: d };
    setMsg(null);
    var box = $('#upPreview');
    box.innerHTML = '<div class="status info">تمت قراءة «' + esc(file.name) + '». راجع الأعداد ثم اعتمد الملف ليحلّ محل البيانات الحالية.</div>' + previewTable(d) +
      '<div class="btn-row" style="margin-top:12px"><button class="btn" id="upConfirm">اعتماد الملف وحفظه</button><button class="btn ghost" id="upCancel">إلغاء</button></div>';
    $('#upCancel').addEventListener('click', function(){ UP = null; box.innerHTML = ''; });
    $('#upConfirm').addEventListener('click', confirmUpload);
  }catch(e){
    setMsg('error', 'تعذّرت قراءة الملف: ' + (e && e.message ? e.message : e));
  }
}
async function confirmUpload(){
  if(!UP) return;
  var b = $('#upConfirm'); if(b){ b.disabled = true; b.textContent = 'جاري الحفظ…'; }
  try{
    var map = {};
    DS_KEYS.forEach(function(k){ map[k] = UP.data[k] || []; });
    await writeDatasets(map, 'ملف إكسل — ' + UP.name);
    UP = null; ED = null;
    toast('تم حفظ البيانات من الملف');
    RENDERERS.data();
  }catch(e){
    setMsg('error', 'تعذّر الحفظ: ' + (e && e.message ? e.message : e));
    if(b){ b.disabled = false; b.textContent = 'اعتماد الملف وحفظه'; }
  }
}

function accessCard(){
  return '<div class="panel"><h3>من يرى ماذا</h3><div class="panel-sub">يُحدَّث كل شيء تلقائيًا عند الحفظ، دون أي نشر يدوي.</div>' +

      '<div class="panel"><h3>تحديث كامل من ملف إكسل</h3><div class="panel-sub">' + st + '</div>' +
        '<label class="file-drop" id="drop"><input type="file" id="xlFile" accept=".xlsx,.xlsm,.xls">' + icon('upload').replace('<svg ', '<svg width="26" height="26" ') + '<div style="margin-top:6px">اضغط لاختيار الملف أو اسحبه هنا</div><div class="xl-note">يُقرأ الملف داخل المتصفح ولا يُرفع إلى أي جهة</div></label>' +
        '<div id="upPreview" style="margin-top:12px"></div></div>' +
      accessCard() +
    '</div>' +
    '<div class="sec-title">تعديل البيانات الرئيسية</div>' +
    (HR_STATE === 'ready' ? '<div class="ds-list" id="dsList"></div><div id="edBox" style="margin-top:14px"></div>'
      : '<div class="empty-state">ستظهر جداول التعديل بعد حفظ أول ملف.</div>') +
    '<div class="sec-title">طريقة العمل</div>' +
    '<div class="panel"><ol class="steps">' +
      '<li>عدّل خلية أو أضف صفًا من الجداول أعلاه، أو ارفع ملف الإكسل المحدّث ليحل محل كل البيانات.</li>' +
      '<li>بعد الحفظ تتحدّث الصفحات المفتوحة عند الجميع تلقائيًا خلال ثوانٍ، دون إعادة تحميل.</li>' +
    '</ol></div>';

  var f = $('#xlFile');
  if(f){
    f.addEventListener('change', function(){ handleFile(f.files && f.files[0]); f.value = ''; });
    var drop = $('#drop');
    ['dragenter', 'dragover'].forEach(function(n){ drop.addEventListener(n, function(e){ e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function(n){ drop.addEventListener(n, function(e){ e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function(e){ var fl = e.dataTransfer && e.dataTransfer.files; if(fl && fl[0]) handleFile(fl[0]); });
  }
  if(HR_STATE === 'ready'){ renderDsList(); if(ED) renderEditor(); }
};

/* ============================================================
   Firebase layer: sign-in, role lookup, live data tiers, writes, user management.

   Firestore collections (access is enforced by the security rules, not by this code):
     public/  anyone can read     licensed-staff list for the medical pages
     hr/      HR users + admin    the datasets with money, ID numbers, phones, bank details removed
     fin/     admin only          the full datasets
     users/   admin (and self)    { username, name, role: 'hr' | 'admin' | 'none' }
   Each tier is stored as  d0..dN  (pieces of one JSON string)  +  meta  { v, n, updated_at, source, counts }
   and is replaced with one atomic batch, so readers never see half of an update.
   ============================================================ */
var LOGIN_DOMAIN = '@dentera.local';
var OWNER_EMAIL = 'admin' + LOGIN_DOMAIN;
var FB = { auth: null, db: null, ok: false };
var UNSUB = {};
var USERS = null;               // admin only: rows of the users collection
var authSeq = 0;
var writeQ = Promise.resolve();

function toEmail(id){
  id = String(id || '').trim().toLowerCase();
  return id.indexOf('@') > -1 ? id : id + LOGIN_DOMAIN;
}
function fromEmail(email){
  email = String(email || '');
  return email.slice(-LOGIN_DOMAIN.length) === LOGIN_DOMAIN ? email.slice(0, -LOGIN_DOMAIN.length) : email;
}
function todayISO(){ return TODAY.getFullYear() + '-' + String(TODAY.getMonth() + 1).padStart(2, '0') + '-' + String(TODAY.getDate()).padStart(2, '0'); }
function formBusy(sel){ var a = document.activeElement; return !!(a && a.closest && a.closest(sel)); }
function enqueue(fn){ var p = writeQ.then(fn); writeQ = p.catch(function(){}); return p; }

function authMsg(e){
  var c = (e && e.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return 'اسم المستخدم أو كلمة المرور غير صحيحة.';
  if(c === 'auth/too-many-requests') return 'محاولات كثيرة. انتظر دقائق ثم حاول مرة ثانية.';
  if(c === 'auth/network-request-failed') return 'تعذّر الاتصال بالإنترنت. تحقق من الشبكة وحاول مرة ثانية.';
  if(c === 'auth/user-disabled') return 'هذا الحساب موقوف.';
  if(c === 'auth/email-already-in-use') return 'اسم المستخدم مستخدم من قبل.';
  if(c === 'auth/weak-password') return 'كلمة المرور ضعيفة. استخدم 8 خانات أو أكثر.';
  if(c === 'auth/requires-recent-login') return 'سجّل الخروج ثم ادخل من جديد وأعد المحاولة.';
  if(c === 'permission-denied') return 'ليست لديك صلاحية لهذه العملية.';
  return (e && e.message) ? e.message : 'حدث خطأ غير متوقع.';
}

/* ---------------- start-up ---------------- */
function fbInit(){
  var cfg = (typeof FIREBASE_CONFIG !== 'undefined') ? FIREBASE_CONFIG : null;
  if(!window.firebase) throw new Error('تعذّر تحميل مكتبة Firebase. تحقق من الاتصال بالإنترنت ثم أعد فتح الصفحة.');
  if(!cfg || !cfg.apiKey || !cfg.projectId || /^PUT_/.test(cfg.apiKey)) throw new Error('الموقع لم يُربط بقاعدة البيانات بعد.');
  firebase.initializeApp(cfg);
  FB.auth = firebase.auth();
  FB.db = firebase.firestore();
  try{ FB.db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); }catch(e){}
  FB.ok = true;
}

function connect(){
  try{ fbInit(); }
  catch(e){
    S.fbError = e.message; S.authDone = true; PUB_STATE = 'error';
    refreshView(); return;
  }
  FB.auth.onAuthStateChanged(function(u){ onAuth(u); });
  startPublic();
}

function docsOf(snap){
  var docs = {};
  snap.docs.forEach(function(d){ docs[d.id] = d.data(); });
  return docs;
}
/* one tier = meta + pieces; returns {state:'empty'|'partial'|'error'|'ready', value, meta} */
function assemble(docs){
  var meta = docs.meta;
  if(!meta) return { state: 'empty' };
  var s = '';
  for(var i = 0; i < meta.n; i++){
    var p = docs['d' + i];
    if(!p || p.v !== meta.v) return { state: 'partial' };
    s += p.s;
  }
  try{ return { state: 'ready', value: JSON.parse(s), meta: meta }; }
  catch(e){ return { state: 'error' }; }
}

/* ---------------- public tier (everyone, signed in or not) ---------------- */
function startPublic(){
  var t = setTimeout(function(){
    if(PUB_STATE === 'loading'){ PUB_STATE = 'error'; refreshView(); }
  }, 15000);
  UNSUB.pub = FB.db.collection('public').onSnapshot(function(snap){
    clearTimeout(t);
    var a = assemble(docsOf(snap));
    if(a.state === 'partial') return;
    if(a.state === 'ready'){ PUB = a.value; PUB_STATE = 'ready'; }
    else if(a.state === 'empty'){ PUB = null; PUB_STATE = 'empty'; }
    else { PUB_STATE = 'error'; }
    recomputeReport();
    refreshView();
  }, function(){ clearTimeout(t); PUB_STATE = 'error'; refreshView(); });
}

/* ---------------- auth ---------------- */
async function resolveRole(u){
  var role = 'none', info = null;
  try{
    var snap = await FB.db.doc('users/' + u.uid).get();
    if(snap.exists){
      info = snap.data() || {};
      if(info.role === 'admin' || info.role === 'hr') role = info.role;
    }
  }catch(e){}
  if(u.email === OWNER_EMAIL) role = 'admin';
  return { role: role, info: info };
}

async function onAuth(u){
  var seq = ++authSeq;
  if(!u){
    var had = !!S.user;
    S.user = null; S.role = null; S.username = '';
    stopPrivate(); stopUsers(); resetData();
    S.authDone = true;
    var cur = routeById(state.tab);
    if(had && cur && cur.tier !== 'public') goTab('medlic'); else refreshView();
    return;
  }
  var r = await resolveRole(u);
  if(seq !== authSeq) return;
  S.user = u; S.role = r.role;
  S.username = (r.info && r.info.name) || fromEmail(u.email);
  S.authDone = true;
  startPrivate();
  if(S.role === 'admin') startUsers(); else stopUsers();
  var want = state.wanted && routeById(state.wanted);
  state.wanted = null;
  var cur2 = routeById(state.tab);
  if(cur2 && cur2.id === 'login'){
    var target = (want && canSee(want)) ? want : routeById('monthly');
    if(S.role === 'none') goTab('account'); else goTab(target.id);
  } else refreshView();
}

async function signIn(username, password, remember){
  var P = firebase.auth.Auth.Persistence;
  try{ await FB.auth.setPersistence(remember ? P.LOCAL : P.SESSION); }catch(e){}
  await FB.auth.signInWithEmailAndPassword(toEmail(username), password);
}
function signOut(){ return FB.auth.signOut(); }

async function changePassword(cur, nw){
  var u = FB.auth.currentUser;
  if(!u) throw new Error('لم يتم تسجيل الدخول.');
  var cred = firebase.auth.EmailAuthProvider.credential(u.email, cur);
  await u.reauthenticateWithCredential(cred);
  await u.updatePassword(nw);
}

/* ---------------- private tier ---------------- */
function stopPrivate(){ if(UNSUB.priv){ try{ UNSUB.priv(); }catch(e){} UNSUB.priv = null; } HR_STATE = 'idle'; }
function startPrivate(){
  stopPrivate();
  if(S.role !== 'hr' && S.role !== 'admin') return;
  var tier = S.role === 'admin' ? 'fin' : 'hr';
  HR_STATE = 'loading';
  var t = setTimeout(function(){
    if(HR_STATE === 'loading'){ HR_STATE = 'error'; HR_ERR = 'انتهت مهلة تحميل البيانات. تحقق من الاتصال ثم أعد فتح الصفحة.'; refreshView(); }
  }, 15000);
  UNSUB.priv = FB.db.collection(tier).onSnapshot(function(snap){
    clearTimeout(t);
    var a = assemble(docsOf(snap));
    if(a.state === 'partial') return;
    if(a.state === 'empty'){ DATA = null; HRMETA = null; REPORT = null; HR_STATE = 'empty'; refreshView(); return; }
    if(a.state === 'error'){ HR_STATE = 'error'; HR_ERR = 'البيانات المحفوظة تالفة. ارفع ملف الإكسل من جديد.'; refreshView(); return; }
    setData(a.value, a.meta);
  }, function(e){
    clearTimeout(t);
    HR_STATE = 'error';
    HR_ERR = (e && e.code === 'permission-denied') ? 'ليست لديك صلاحية قراءة هذه البيانات.' : ((e && e.message) || 'تعذّرت قراءة البيانات.');
    refreshView();
  });
}

function emptyData(){ var d = {}; DS_KEYS.forEach(function(k){ d[k] = []; }); return d; }
function resetData(){
  DATA = null; HRMETA = null; REPORT = null; ED = null; UP = null; USERS = null;
  try{ deriveFromData(emptyData()); }catch(e){}
}
function recomputeReport(){
  if(!DATA){ REPORT = null; return; }
  try{ REPORT = SR.buildReport(DATA, todayISO(), (PUB && PUB.clinical_staff) || []); }
  catch(e){ REPORT = null; if(window.console) console.error(e); }
}
function setData(D, meta){
  DS_KEYS.forEach(function(k){ if(!Array.isArray(D[k])) D[k] = []; });
  DATA = D; HRMETA = meta; HR_STATE = 'ready';
  TODAY = today0();
  deriveFromData(D);
  recomputeReport();
  refreshView();
}

/* ---------------- users (admin) ---------------- */
function stopUsers(){ if(UNSUB.users){ try{ UNSUB.users(); }catch(e){} UNSUB.users = null; } USERS = null; }
function startUsers(){
  stopUsers();
  UNSUB.users = FB.db.collection('users').onSnapshot(function(snap){
    USERS = snap.docs.map(function(d){ var x = d.data() || {}; x.uid = d.id; return x; })
      .sort(function(a, b){ return String(a.username || '').localeCompare(String(b.username || '')); });
    if(state.tab === 'users' && !formBusy('#addUser')) RENDERERS.users();
  }, function(){ USERS = []; if(state.tab === 'users' && !formBusy('#addUser')) RENDERERS.users(); });
}

/* A second app instance creates the account, so the admin stays signed in. */
async function createUserAccount(username, name, password, role){
  var cfg = FIREBASE_CONFIG, email = toEmail(username);
  var app2 = firebase.initializeApp(cfg, 'sec' + Date.now());
  try{
    var a2 = app2.auth();
    try{ await a2.setPersistence(firebase.auth.Auth.Persistence.NONE); }catch(e){}
    var cred = await a2.createUserWithEmailAndPassword(email, password);
    var uid = cred.user.uid;
    try{ await a2.signOut(); }catch(e){}
    await FB.db.doc('users/' + uid).set({
      username: fromEmail(email), name: name || fromEmail(email), role: role,
      created_at: new Date().toISOString(), created_by: fromEmail(FB.auth.currentUser.email)
    });
    return uid;
  } finally { try{ await app2.delete(); }catch(e){} }
}
function setUserRole(uid, role){ return FB.db.doc('users/' + uid).update({ role: role }); }
function removeUserDoc(uid){ return FB.db.doc('users/' + uid).delete(); }

/* ---------------- writing data (admin) ---------------- */
function splitStr(s, n){
  var out = [], i = 0;
  while(i < s.length){
    var j = Math.min(s.length, i + n);
    var c = s.charCodeAt(j - 1);
    if(j < s.length && c >= 0xD800 && c <= 0xDBFF) j--;     // never cut a surrogate pair
    out.push(s.slice(i, j)); i = j;
  }
  return out.length ? out : [''];
}
async function writeTier(name, value, source, counts){
  var parts = splitStr(JSON.stringify(value), 300000);
  var v = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  var prev = await FB.db.doc(name + '/meta').get();
  var pn = prev.exists ? ((prev.data() || {}).n || 0) : 0;
  var b = FB.db.batch();
  parts.forEach(function(p, i){ b.set(FB.db.doc(name + '/d' + i), { v: v, i: i, s: p }); });
  for(var j = parts.length; j < pn; j++) b.delete(FB.db.doc(name + '/d' + j));
  b.set(FB.db.doc(name + '/meta'), { v: v, n: parts.length, updated_at: new Date().toISOString(), source: source || '', counts: counts || {} });
  await b.commit();
}
/* full data -> fin (admin), sanitized copy -> hr, licensed-staff list -> public */
function saveAll(D, source){
  return enqueue(async function(){
    if(!FB.ok || S.role !== 'admin') throw new Error('الحفظ للأدمن فقط.');
    var counts = {}; DS_KEYS.forEach(function(k){ counts[k] = (D[k] || []).length; });
    var pub = SR.buildPublic(D, todayISO());
    await writeTier('fin', D, source, counts);
    await writeTier('hr', SR.sanitizeForHr(D), source, counts);
    await writeTier('public', pub, source, { clinical_staff: pub.clinical_staff.length });
    return { updated_at: new Date().toISOString(), source: source, counts: counts };
  });
}

];
var GROUPS = { reports:'التقارير', medical:'الكوادر الطبية', hr:'الموارد البشرية', admin:'الإدارة', me:'الحساب', auth:'الموارد البشرية' };
function routeById(id){ return ROUTES.filter(function(r){ return r.id === id; })[0]; }
function routeByHash(h){ return ROUTES.filter(function(r){ return r.hash === h; })[0]; }
function signedIn(){ return !!(S.user && (S.role === 'hr' || S.role === 'admin')); }
function canSee(r){
  if(r.tier === 'public') return true;
  if(r.tier === 'user') return !!S.user;
  if(r.tier === 'hr') return S.role === 'hr' || S.role === 'admin';
  return S.role === 'admin';
}
/* pages that read the private datasets */
function needsHrData(r){ return (r.tier === 'hr' || r.tier === 'admin') && r.id !== 'data' && r.id !== 'users'; }

function renderNav(){
  var html = '', last = '';
  ROUTES.forEach(function(r){
    if(r.id === 'login'){ if(S.user) return; }
    else if(!canSee(r)) return;
    if(r.group !== last){
      last = r.group;
      html += '<div class="nav-group">' + (r.group === 'auth' ? icon('lock') : '') + esc(GROUPS[r.group]) + '</div>';
    }
    var count = null;
    if(S.role === 'admin' && HR_STATE === 'ready'){
      if(r.id === 'licenses') count = ALERTS.filter(function(a){ return a.tab === 'licenses'; }).length;
      if(r.id === 'contracts') count = ALERTS.filter(function(a){ return a.tab === 'contracts'; }).length;
    }
    html += '<button class="nav-item' + (r.id === state.tab ? ' active' : '') + (count ? ' has-alert' : '') + (r.id === 'login' ? ' locked' : '') + '" data-tab="' + r.id + '">' +
      icon(r.id === 'login' ? 'lock' : r.id) + '<span>' + esc(r.label) + '</span>' + (count ? '<span class="nav-count">' + count + '</span>' : '') + '</button>';
  });
  $('#nav').innerHTML = html;
  $all('#nav .nav-item').forEach(function(el){ el.addEventListener('click', function(){ goTab(el.getAttribute('data-tab')); }); });

  var role = $('#roleChip'), who = $('#whoName'), out = $('#footOut');
  if(role){
    role.className = 'role-chip' + (S.user ? '' : ' guest');
    role.textContent = S.user ? (ROLE_LABEL[S.role] || '—') : (S.authDone ? 'زائر' : 'جاري التحقق…');
  }
  if(who) who.textContent = S.user ? S.username : '';
  if(out) out.hidden = !S.user;
}

function updateTopbar(){
  var r = routeById(state.tab) || ROUTES[0];
  $('#viewTitle').textContent = r.label;
  $('#viewSub').textContent = r.sub;
  var isHr = r.group === 'hr' && S.role === 'admin' && HR_STATE === 'ready';
  var isMed = r.group === 'medical';
  var sw = $('#searchWrap');
  sw.hidden = !(isHr || isMed);
  $('#globalSearch').placeholder = isHr ? 'ابحث عن موظف بالاسم أو رقم الهوية…' : 'ابحث بالاسم…';
  var v = $('#globalSearch'); var want = isHr ? (state.dirQuery || '') : (isMed ? (state.medQuery || '') : '');
  if(v.value !== want) v.value = want;
  var ap = $('#alertPill'); ap.hidden = !isHr; if(isHr) $('#alertCount').textContent = ALERTS.length;
  var ft = $('#footer');
  if(ft) ft.textContent = (PUB && PUB.generated_at && r.tier === 'public') ? 'آخر تحديث لبيانات الكوادر الطبية: ' + stampText(PUB.generated_at) + '.' : '';
}
function stampText(iso){ var d = new Date(iso); return isNaN(d.getTime()) ? '' : d.getDate() + ' ' + AR_MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }

function spinHTML(title, text){ return '<div class="gate"><div class="spin"></div><h2>' + esc(title) + '</h2>' + (text ? '<p>' + esc(text) + '</p>' : '') + '</div>'; }
function pubStateHTML(){
  if(S.fbError) return fbErrorHTML();
  if(PUB_STATE === 'loading') return spinHTML('جاري تحميل البيانات');
  if(PUB_STATE === 'empty'){
    var admin = S.role === 'admin';
    return '<div class="gate">' + icon('data') + '<h2>لا توجد بيانات منشورة بعد</h2><p>' +
      (admin ? 'ارفع ملف الإكسل الرئيسي من «إدارة البيانات» لتظهر الصفحات للجميع.' : 'ستظهر هنا بمجرد رفع البيانات.') + '</p>' +
      (admin ? '<div class="btn-row" style="justify-content:center;margin-top:14px"><button class="btn" id="gateData">فتح إدارة البيانات</button></div>' : '') + '</div>';
  }
  return '<div class="gate">' + icon('alert') + '<h2>تعذّر تحميل البيانات</h2><p>تحقق من الاتصال بالإنترنت ثم أعد فتح الصفحة.</p></div>';
}
function hrStateHTML(){
  if(HR_STATE === 'loading' || HR_STATE === 'idle') return spinHTML('جاري تحميل بيانات الموارد البشرية');
  if(HR_STATE === 'empty'){
    var admin = S.role === 'admin';
    return '<div class="gate">' + icon('data') + '<h2>لا توجد بيانات محفوظة بعد</h2><p>' +
      (admin ? 'ارفع ملف الإكسل الرئيسي من شاشة إدارة البيانات لتظهر الصفحات.' : 'سيرفع الأدمن البيانات قريبًا.') + '</p>' +
      (admin ? '<div class="btn-row" style="justify-content:center;margin-top:14px"><button class="btn" id="gateData">فتح إدارة البيانات</button></div>' : '') + '</div>';
  }
  return '<div class="gate">' + icon('alert') + '<h2>تعذّر تحميل البيانات</h2><p>' + esc(HR_ERR || 'حدث خطأ غير متوقع.') + '</p></div>';
}
function deniedHTML(adminOnly){
  return '<div class="gate">' + icon('lock') + '<h2>' + (adminOnly ? 'هذه الصفحة للأدمن فقط' : 'لا تملك صلاحية') + '</h2>' +
    '<p>' + (adminOnly ? 'تحتوي على رواتب وأرقام هوية وبيانات بنكية، لذلك لا تظهر إلا لحساب الأدمن.' : 'حسابك لا يملك صلاحية لهذه الصفحة. اطلب من الأدمن تفعيله.') + '</p>' +
    '<div class="btn-row" style="justify-content:center;margin-top:14px"><button class="btn" id="gateBack">العودة</button></div></div>';
}

function goTab(id, fromHash){
  var r = routeById(id) || routeById('medlic');
  if(state.tab !== r.id && ED && edChanges() && r.id !== 'data'){ ED = null; }
  if(r.tier !== 'public' && !S.user && r.id !== 'login'){ state.wanted = r.id; state.loginNote = 'سجّل الدخول لفتح «' + r.label + '».'; }
  else if(r.id === 'login' && !state.wanted){ state.loginNote = ''; }
  state.tab = r.id;
  if(!fromHash && location.hash.slice(1) !== r.hash){ try{ location.hash = r.hash; }catch(e){} }
  $all('#nav .nav-item').forEach(function(el){ el.classList.toggle('active', el.getAttribute('data-tab') === r.id); });
  $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show');
  renderView();
  renderNav();
  updateTopbar();
  window.scrollTo(0, 0);
}

function renderView(){
  var r = routeById(state.tab) || ROUTES[0], v = $('#view');
  destroyCharts();
  refreshPalette();
  try{
    if(r.tier !== 'public'){
      if(S.fbError){ v.innerHTML = fbErrorHTML(); return; }
      if(!S.authDone){ v.innerHTML = spinHTML('جاري التحقق من الدخول'); return; }
      if(!S.user){
        // not signed in: the sign-in form takes the place of the protected page
        var saved = state.tab; state.tab = 'login'; RENDERERS.login(); state.tab = saved;
        return;
      }
      if(!canSee(r) || (S.role === 'none' && r.tier !== 'user')){
        v.innerHTML = deniedHTML(S.role !== 'none');
        var gb = $('#gateBack'); if(gb) gb.addEventListener('click', function(){ goTab(S.role === 'none' ? 'account' : 'monthly'); });
        return;
      }
      if(needsHrData(r) && HR_STATE !== 'ready'){
        v.innerHTML = hrStateHTML();
        var gd = $('#gateData'); if(gd) gd.addEventListener('click', function(){ goTab('data'); });
        return;
      }
    } else if(r.group === 'medical' && PUB_STATE !== 'ready'){
      v.innerHTML = pubStateHTML();
      var gd2 = $('#gateData'); if(gd2) gd2.addEventListener('click', function(){ goTab('data'); });
      return;
    }
    RENDERERS[r.id]();
  }catch(e){
    v.innerHTML = '<div class="gate">' + icon('alert') + '<h2>تعذّر عرض هذه الصفحة</h2><p>' + esc(e && e.message ? e.message : e) + '</p></div>';
    if(window.console) console.error(e);
  }
}

/* re-render after data, access or theme changed, keeping scroll position and anything being typed */
function refreshView(){
  if(!$('#view')) return;
  var y = window.pageYOffset;
  renderNav(); updateTopbar();
  var ae = document.activeElement;
  var typing = ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && $('#view').contains(ae);
  var editing = state.tab === 'data' && ED && edChanges();
  var formTab = (state.tab === 'login' && !S.user) || state.tab === 'account' || state.tab === 'users';
  if(!editing && !(typing && formTab)) renderView();
  window.scrollTo(0, y);
}

/* ---------------- shell ---------------- */
function renderShell(){
  $('#root').innerHTML =
    '<div class="app">' +
    '<aside class="sidebar" id="sidebar">' +
      '<div class="brand"><div class="brand-card"><img src="' + LOGO + '" alt="Dentera"></div><div class="brand-sub">منصّة بيانات دنتيرا</div></div>' +
      '<nav id="nav"></nav>' +
      '<div class="sidebar-foot"><span class="role-chip guest" id="roleChip">جاري التحقق…</span><span class="who-name" id="whoName"></span>' +
        '<button class="foot-btn" id="footOut" hidden>' + icon('out') + '<span>تسجيل الخروج</span></button></div>' +
    '</aside><div class="scrim" id="scrim"></div>' +
    '<div class="main"><header class="topbar">' +
      '<button class="menu-btn" id="menuBtn" aria-label="القائمة">' + icon('menu').replace('<svg ', '<svg width="18" height="18" ') + '</button>' +
      '<div class="topbar-title"><h1 id="viewTitle"></h1><div class="topbar-sub" id="viewSub"></div></div>' +
      '<div class="pill danger" id="alertPill" hidden role="button" tabindex="0">' + icon('alert') + '<span id="alertCount">0</span> تنبيه يحتاج متابعة</div>' +
      '<div class="search-wrap" id="searchWrap" hidden><input type="text" id="globalSearch" placeholder="ابحث…" autocomplete="off">' + icon('search') + '</div>' +
    '</header><div class="view" id="view"></div><div class="footer-credit" id="footer"></div></div></div>' +
    '<div class="toast" id="toast"></div>';

  $('#menuBtn').addEventListener('click', function(){ $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('show'); });
  $('#scrim').addEventListener('click', function(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); });
  $('#footOut').addEventListener('click', function(){ if(FB.ok) signOut(); });
  $('#alertPill').addEventListener('click', function(){
    goTab('overview');
    setTimeout(function(){ var p = $('#alertsPanel'); if(p && p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30);
  });
  $('#globalSearch').addEventListener('input', function(){
    var r = routeById(state.tab);
    if(r.group === 'medical'){ state.medQuery = this.value; RENDERERS[r.id](); }
    else if(r.group === 'hr' && S.role === 'admin'){
      state.dirQuery = this.value;
      if(state.tab !== 'directory') goTab('directory'); else renderDirectoryResults();
    }
  });
}

function watchTheme(){
  var again = function(){ refreshPalette(); refreshView(); };
  try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', again); }catch(e){}
  try{ new MutationObserver(again).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); }catch(e){}
}

function boot(){
  document.documentElement.setAttribute('dir', 'rtl');
  document.documentElement.setAttribute('lang', 'ar');
  TODAY = today0();
  refreshPalette();
  renderShell();
  var r = routeByHash(location.hash.slice(1));
  renderNav();
  goTab(r ? r.id : 'medlic', true);
  window.addEventListener('hashchange', function(){
    var x = routeByHash(location.hash.slice(1));
    if(x && x.id !== state.tab) goTab(x.id, true);
  });
  watchTheme();
  var t = store('dentera_toast');
  if(t){ store('dentera_toast', ''); toast(t); }
  connect();
  window.__SITE__ = { S: S, state: state, goTab: goTab, RENDERERS: RENDERERS,
    getPUB: function(){ return PUB; }, getDATA: function(){ return DATA; }, getREPORT: function(){ return REPORT; }, charts: CH };
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script></body></html>
